<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전국 관광 스팟 룰렛</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg: #1B2A22;
  --surface: #223529;
  --surface-2: #2B4232;
  --line: #3B5643;
  --gold: #E3B23C;
  --coral: #E2785C;
  --ice: #F1F0E6;
  --muted: #8FA394;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ice);
  font-family:'IBM Plex Sans KR', sans-serif;
  padding:32px 20px 60px;
  min-height:100vh;
}
.wrap{max-width:820px;margin:0 auto;}

.eyebrow{
  font-family:'Space Grotesk',sans-serif;
  font-size:12px;letter-spacing:0.12em;color:var(--gold);
  text-transform:uppercase;margin:0 0 4px;
}
h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:26px;font-weight:600;margin:0 0 18px;color:var(--ice);
}
.divider{
  height:2px;background:linear-gradient(90deg, var(--gold), var(--coral) 60%, var(--line));
  opacity:0.6;margin:0 0 26px;border-radius:1px;
}

.controls-row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:24px;}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;}
.field select{
  background:var(--surface-2);border:1px solid var(--line);border-radius:7px;
  color:var(--ice);font-family:'JetBrains Mono',monospace;font-size:13px;padding:8px 9px;min-width:150px;
}
.field select:focus{outline:1px solid var(--gold);}
.check-field{display:flex;align-items:center;gap:7px;padding-bottom:9px;}
.check-field input{width:15px;height:15px;}
.check-field label{font-size:12.5px;color:var(--muted);margin:0;}

.spin-btn{
  background:var(--coral);color:#341206;border:none;border-radius:8px;
  font-family:'IBM Plex Sans KR',sans-serif;font-weight:600;font-size:14px;
  padding:11px 22px;cursor:pointer;white-space:nowrap;
}
.spin-btn:hover{opacity:0.9;}
.spin-btn:disabled{opacity:0.5;cursor:default;}

.spot-count{font-size:12px;color:var(--muted);margin:-14px 0 20px;}

.wheel-area{display:flex;justify-content:center;align-items:center;margin-bottom:22px;position:relative;}
.pointer{
  position:absolute;top:-2px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;
  border-top:20px solid var(--gold);z-index:2;
}
#wheel-svg{transition:transform 4.2s cubic-bezier(0.12,0.72,0.15,1);}

.result-card{
  background:var(--surface);border:1px solid var(--gold);border-radius:10px;
  padding:18px 20px;margin-bottom:22px;display:none;
}
.result-region{font-size:12px;color:var(--muted);margin:0 0 4px;}
.result-name{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;color:var(--gold);margin:0 0 6px;}
.result-blurb{font-size:14px;color:var(--ice);margin:0 0 12px;line-height:1.5;}
.visited-btn{
  background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:7px;font-size:12.5px;padding:6px 12px;cursor:pointer;
}
.visited-btn.done{border-color:var(--gold);color:var(--gold);}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;}
.panel-title{font-size:12px;color:var(--muted);letter-spacing:0.04em;text-transform:uppercase;margin:0 0 14px;}
.city-group{margin-bottom:14px;}
.city-group:last-child{margin-bottom:0;}
.city-name{font-size:12px;color:var(--gold);font-weight:600;margin:0 0 7px;}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  background:var(--surface-2);border:1px solid var(--line);border-radius:16px;
  padding:6px 12px;font-size:12.5px;color:var(--ice);cursor:pointer;user-select:none;
}
.chip:hover{border-color:var(--gold);}
.chip.visited{color:var(--muted);text-decoration:line-through;border-color:var(--line);}
.chip.landed{border-color:var(--gold);color:var(--gold);}

#confetti-canvas{
  position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:3;
}

.stats-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:18px;margin-bottom:20px;
}
.stats-row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:12px;}
.stats-block{flex:1;min-width:200px;}
.stats-label{font-size:11.5px;color:var(--muted);margin:0 0 5px;}
.stats-value{font-family:'JetBrains Mono',monospace;font-size:19px;color:var(--ice);margin:0 0 7px;}
.progress-track{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:var(--gold);border-radius:4px;transition:width 0.4s ease;}
.progress-fill.region{background:var(--coral);}

.link-row{display:flex;gap:8px;margin-top:2px;}
.link-btn{
  display:inline-block;background:var(--surface-2);border:1px solid var(--line);
  color:var(--ice);text-decoration:none;font-size:12px;border-radius:6px;
  padding:6px 11px;
}
.link-btn:hover{border-color:var(--gold);color:var(--gold);}

.tilemap-wrap{display:flex;gap:24px;flex-wrap:wrap;align-items:center;}
.realmap-svg{flex:0 0 auto;}
.realmap-svg path{
  stroke:#16221B;stroke-width:0.7;cursor:pointer;transition:opacity 0.15s;
}
.realmap-svg path:hover{opacity:0.82;}
.realmap-svg path.active{stroke:var(--coral);stroke-width:2;}
.realmap-svg .sejong-dot{cursor:pointer;stroke:#16221B;stroke-width:0.7;}
.realmap-svg .sejong-dot.active{stroke:var(--coral);stroke-width:1.6;}
.tilemap-legend{display:flex;flex-direction:column;gap:8px;min-width:150px;}
.legend-scale{display:flex;align-items:center;gap:6px;}
.legend-bar{width:90px;height:10px;border-radius:5px;background:linear-gradient(90deg, var(--surface-2), var(--gold));}
.legend-text{font-size:11px;color:var(--muted);}
.map-tooltip{
  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gold);
  min-height:18px;margin-top:4px;
}
</style>
</head>
<body>
<div class="wrap">

  <p class="eyebrow">National spot roulette</p>
  <h1>전국 관광 스팟 룰렛</h1>
  <div class="divider"></div>

  <div class="controls-row">
    <div class="field">
      <label>지역 선택</label>
      <select id="region-select"></select>
    </div>
    <div class="field">
      <label>세부 지역 (시·군)</label>
      <select id="city-select"></select>
    </div>
    <div class="check-field">
      <input type="checkbox" id="exclude-visited">
      <label for="exclude-visited">다녀온 곳 제외하고 뽑기</label>
    </div>
    <button class="spin-btn" id="spin-btn">룰렛 돌리기</button>
  </div>
  <p class="spot-count" id="spot-count"></p>

  <div class="wheel-area">
    <div class="pointer"></div>
    <svg id="wheel-svg" width="280" height="280" viewBox="0 0 280 280"></svg>
    <canvas id="confetti-canvas"></canvas>
  </div>

  <div class="result-card" id="result-card">
    <p class="result-region" id="result-region"></p>
    <p class="result-name" id="result-name"></p>
    <p class="result-blurb" id="result-blurb"></p>
    <div class="link-row" id="result-links"></div>
    <button class="visited-btn" id="visited-toggle" style="margin-top:10px;"></button>
  </div>

  <div class="panel" style="margin-bottom:20px;">
    <p class="panel-title">전국 방문 지도 (시·군 단위)</p>
    <div class="tilemap-wrap">
      <svg class="realmap-svg" id="realmap-svg" width="300" height="300"></svg>
      <div class="tilemap-legend">
        <div class="legend-scale">
          <div class="legend-bar"></div>
        </div>
        <p class="legend-text">색이 진할수록 그 시·군 방문률이 높다는 뜻이에요. 클릭하면 그 지역/시·군으로 바로 이동합니다. 스팟이 아직 없는 시·군은 회색으로 표시돼요.</p>
        <p class="map-tooltip" id="map-tooltip"></p>
      </div>
    </div>
  </div>

  <div class="stats-panel">
    <p class="panel-title">나의 방문 기록</p>
    <div class="stats-row">
      <div class="stats-block">
        <p class="stats-label">전국 전체 진행률</p>
        <p class="stats-value" id="stats-total-value">-</p>
        <div class="progress-track"><div class="progress-fill" id="stats-total-bar" style="width:0%;"></div></div>
      </div>
      <div class="stats-block">
        <p class="stats-label" id="stats-region-label">현재 지역 진행률</p>
        <p class="stats-value" id="stats-region-value">-</p>
        <div class="progress-track"><div class="progress-fill region" id="stats-region-bar" style="width:0%;"></div></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <p class="panel-title" id="list-title">지역 스팟 목록</p>
    <div id="city-groups"></div>
  </div>

</div>

let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTick(){
  try{
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = 720;
    gain.gain.setValueAtTime(0.06, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.05);
  }catch(e){}
}
function playFanfare(){
  try{
    const ctx = getAudioCtx();
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq,i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const start = ctx.currentTime + i*0.11;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.13, start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+0.35);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(start); osc.stop(start+0.36);
    });
  }catch(e){}
}

const CONFETTI_COLORS = ['#E3B23C','#E2785C','#5D7A62','#8FA394','#F1F0E6'];
function fireConfetti(){
  const canvas = document.getElementById('confetti-canvas');
  const area = canvas.parentElement;
  canvas.width = area.clientWidth;
  canvas.height = area.clientHeight;
  const ctx = canvas.getContext('2d');
  const pieces = [];
  for(let i=0;i<70;i++){
    pieces.push({
      x: canvas.width/2 + (Math.random()-0.5)*40,
      y: canvas.height/2,
      vx: (Math.random()-0.5)*6,
      vy: -Math.random()*6-2,
      size: 4+Math.random()*4,
      color: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
      rot: Math.random()*360,
      vrot: (Math.random()-0.5)*12
    });
  }
  let frame = 0;
  function step(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.vy += 0.18;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vrot;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
      ctx.restore();
    });
    if(frame < 90) requestAnimationFrame(step);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  step();
}

function loadVisited(){
  try{
    const v = localStorage.getItem(KEY_VISITED);
    visited = v ? JSON.parse(v) : {};
  }catch(e){ visited = {}; }
  try{
    const r = localStorage.getItem(KEY_LAST_REGION);
    if(r && REGIONS[r]) currentRegionKey = r;
  }catch(e){}
}
function saveVisited(){
  try{ localStorage.setItem(KEY_VISITED, JSON.stringify(visited)); }catch(e){}
}
function visitedKey(regionKey, spotName){ return regionKey + '::' + spotName; }

function lerpColor(hexA, hexB, t){
  const a = [1,3,5].map(i=>parseInt(hexA.slice(i,i+2),16));
  const b = [1,3,5].map(i=>parseInt(hexB.slice(i,i+2),16));
  const c = a.map((v,i)=> Math.round(v + (b[i]-v)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function regionPct(key){
  const region = REGIONS[key];
  const total = region.spots.length;
  const visitedN = region.spots.filter(s=> visited[visitedKey(key, s.n)]).length;
  return total>0 ? visitedN/total : 0;
}

function cityPct(regionKey, cityName){
  const spots = REGIONS[regionKey].spots.filter(s=>s.c===cityName);
  if(spots.length===0) return null;
  const visitedN = spots.filter(s=> visited[visitedKey(regionKey, s.n)]).length;
  return visitedN/spots.length;
}

function renderTilemap(){
  const svg = document.getElementById('realmap-svg');
  svg.setAttribute('viewBox', NATIONAL_MAP_VIEWBOX);
  svg.setAttribute('width', NATIONAL_MAP_W);
  svg.setAttribute('height', NATIONAL_MAP_H);

  let content = '';
  Object.keys(NATIONAL_CITY_PATHS).forEach(regionKey=>{
    const cities = NATIONAL_CITY_PATHS[regionKey];
    Object.keys(cities).forEach(cityName=>{
      const pct = cityPct(regionKey, cityName);
      const hasData = pct !== null;
      const bg = hasData ? lerpColor('#2B4232', '#E3B23C', pct) : '#3A4A40';
      const isActive = (regionKey === currentRegionKey) && (cityName === document.getElementById('city-select').value);
      const label = hasData ? `${REGIONS[regionKey].name} ${cityName} — ${Math.round(pct*100)}% 방문` : `${REGIONS[regionKey].name} ${cityName} — 등록된 스팟 없음`;
      content += `<path d="${cities[cityName]}" fill="${bg}" fill-rule="evenodd" class="${isActive?'active':''}" data-region="${regionKey}" data-city="${cityName}" data-hasdata="${hasData}"><title>${label}</title></path>`;
    });
  });
  const sejongPct = regionPct('sejong');
  const sejongColor = lerpColor('#2B4232', '#E3B23C', sejongPct);
  const sejongActive = currentRegionKey === 'sejong';
  content += `<circle class="sejong-dot ${sejongActive?'active':''}" cx="${SEJONG_POINT[0]}" cy="${SEJONG_POINT[1]}" r="4" fill="${sejongColor}" data-region="sejong"><title>세종특별자치시 ${Math.round(sejongPct*100)}%</title></circle>`;

  svg.innerHTML = content;

  svg.querySelectorAll('[data-region]').forEach(el=>{
    const regionKey = el.getAttribute('data-region');
    const cityName = el.getAttribute('data-city');
    el.addEventListener('click', ()=>{
      const sel = document.getElementById('region-select');
      const needsRegionChange = sel.value !== regionKey;
      sel.value = regionKey;
      if(needsRegionChange){
        sel.dispatchEvent(new Event('change'));
      }
      if(cityName){
        const hasData = el.getAttribute('data-hasdata') === 'true';
        if(!hasData){
          document.getElementById('map-tooltip').textContent = `${REGIONS[regionKey].name} ${cityName}에는 아직 등록된 스팟이 없어요.`;
          return;
        }
        const citySel = document.getElementById('city-select');
        citySel.value = cityName;
        citySel.dispatchEvent(new Event('change'));
      }
    });
    el.addEventListener('mouseenter', ()=>{
      const label = cityName ? `${REGIONS[regionKey].name} ${cityName}` : REGIONS[regionKey].name;
      const pct = cityName ? cityPct(regionKey, cityName) : regionPct(regionKey);
      const pctText = pct !== null ? `${Math.round(pct*100)}% 방문` : '등록된 스팟 없음';
      document.getElementById('map-tooltip').textContent = `${label} — ${pctText}`;
    });
    el.addEventListener('mouseleave', ()=>{
      document.getElementById('map-tooltip').textContent = '';
    });
  });
}

function totalSpotCount(){
  return Object.keys(REGIONS).reduce((sum,k)=> sum + REGIONS[k].spots.length, 0);
}
function totalVisitedCount(){
  return Object.keys(visited).filter(k=> visited[k]).length;
}
function updateStats(){
  const totalAll = totalSpotCount();
  const visitedAll = totalVisitedCount();
  const pctAll = totalAll>0 ? Math.round((visitedAll/totalAll)*100) : 0;
  document.getElementById('stats-total-value').textContent = `${visitedAll} / ${totalAll}곳 (${pctAll}%)`;
  document.getElementById('stats-total-bar').style.width = pctAll + '%';

  const region = REGIONS[currentRegionKey];
  const regionTotal = region.spots.length;
  const regionVisited = region.spots.filter(s=> visited[visitedKey(currentRegionKey, s.n)]).length;
  const pctRegion = regionTotal>0 ? Math.round((regionVisited/regionTotal)*100) : 0;
  document.getElementById('stats-region-label').textContent = region.name + ' 진행률';
  document.getElementById('stats-region-value').textContent = `${regionVisited} / ${regionTotal}곳 (${pctRegion}%)`;
  document.getElementById('stats-region-bar').style.width = pctRegion + '%';
  renderTilemap();
}

function mapLinks(regionName, cityName, spotName){
  const q = encodeURIComponent(`${cityName} ${spotName}`);
  return `<a class="link-btn" href="https://map.kakao.com/link/search/${q}" target="_blank" rel="noopener">카카오맵에서 보기</a>` +
         `<a class="link-btn" href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">네이버맵에서 보기</a>`;
}

function populateRegionSelect(){
  const sel = document.getElementById('region-select');
  sel.innerHTML = Object.keys(REGIONS).map(k=>
    `<option value="${k}">${REGIONS[k].name}</option>`
  ).join('');
  sel.value = currentRegionKey;
}

function uniqueCities(regionKey){
  const seen = [];
  REGIONS[regionKey].spots.forEach(s=>{ if(!seen.includes(s.c)) seen.push(s.c); });
  return seen;
}

function populateCitySelect(){
  const sel = document.getElementById('city-select');
  const cities = uniqueCities(currentRegionKey);
  sel.innerHTML = '<option value="__all__">전체</option>' + cities.map(c=>`<option value="${c}">${c}</option>`).join('');
  sel.value = '__all__';
}

function activeSpots(){
  const region = REGIONS[currentRegionKey];
  const cityFilter = document.getElementById('city-select').value;
  const excludeVisited = document.getElementById('exclude-visited').checked;
  let list = region.spots;
  if(cityFilter && cityFilter !== '__all__') list = list.filter(s => s.c === cityFilter);
  if(excludeVisited){
    const filtered = list.filter(s => !visited[visitedKey(currentRegionKey, s.n)]);
    if(filtered.length > 0) list = filtered;
  }
  return list;
}

const WHEEL_COLORS = ['#E3B23C','#E2785C','#5D7A62','#8FA394'];

function drawWheel(){
  const spots = activeSpots();
  const svg = document.getElementById('wheel-svg');
  const cx=140, cy=140, r=130;
  const n = Math.max(spots.length,1);
  let paths = '';
  for(let i=0;i<n;i++){
    const a0 = (i/n)*2*Math.PI - Math.PI/2;
    const a1 = ((i+1)/n)*2*Math.PI - Math.PI/2;
    const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    const large = (a1-a0) > Math.PI ? 1 : 0;
    const color = WHEEL_COLORS[i % WHEEL_COLORS.length];
    paths += `<path d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} Z" fill="${color}" stroke="#16221B" stroke-width="1.5"/>`;
  }
  svg.innerHTML = `<circle cx="${cx}" cy="${cy}" r="${r+2}" fill="none" stroke="#16221B" stroke-width="2"/>${paths}<circle cx="${cx}" cy="${cy}" r="18" fill="#16221B"/>`;
  svg.style.transition = 'none';
  svg.style.transform = 'rotate(0deg)';
  void svg.offsetWidth;
  svg.style.transition = '';
  document.getElementById('spot-count').textContent = `이번 룰렛 대상: ${spots.length}곳`;
}

function renderChipGroups(highlightName){
  const region = REGIONS[currentRegionKey];
  document.getElementById('list-title').textContent = region.name + ' 스팟 목록 (총 ' + region.spots.length + '곳)';
  const cities = uniqueCities(currentRegionKey);
  const container = document.getElementById('city-groups');
  container.innerHTML = cities.map(city=>{
    const spots = region.spots.filter(s=>s.c===city);
    const chips = spots.map(s=>{
      const isVisited = !!visited[visitedKey(currentRegionKey, s.n)];
      const isLanded = s.n === highlightName;
      let cls = 'chip';
      if(isVisited) cls += ' visited';
      if(isLanded) cls += ' landed';
      return `<span class="${cls}" data-name="${s.n}" title="클릭해서 다녀옴 표시/해제">${s.n}</span>`;
    }).join('');
    return `<div class="city-group"><p class="city-name">${city}</p><div class="chip-grid">${chips}</div></div>`;
  }).join('');
  container.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      const name = el.getAttribute('data-name');
      const key = visitedKey(currentRegionKey, name);
      visited[key] = !visited[key];
      saveVisited();
      renderChipGroups(highlightName);
      updateStats();
      if(landedSpotName === name){
        const vBtn = document.getElementById('visited-toggle');
        const nowVisited = !!visited[key];
        vBtn.textContent = nowVisited ? '다녀온 곳으로 표시됨' : '다녀왔어요로 표시';
        vBtn.className = 'visited-btn' + (nowVisited ? ' done' : '');
      }
    });
  });
}

document.getElementById('region-select').addEventListener('change', (e)=>{
  currentRegionKey = e.target.value;
  localStorage.setItem(KEY_LAST_REGION, currentRegionKey);
  landedSpotName = null;
  document.getElementById('result-card').style.display = 'none';
  populateCitySelect();
  drawWheel();
  renderChipGroups(null);
  updateStats();
});

document.getElementById('city-select').addEventListener('change', ()=>{
  landedSpotName = null;
  document.getElementById('result-card').style.display = 'none';
  drawWheel();
  renderChipGroups(null);
  renderTilemap();
});

document.getElementById('exclude-visited').addEventListener('change', ()=>{
  drawWheel();
  renderChipGroups(landedSpotName);
});

document.getElementById('spin-btn').addEventListener('click', ()=>{
  const spots = activeSpots();
  const n = spots.length;
  if(n === 0) return;
  const svg = document.getElementById('wheel-svg');
  const btn = document.getElementById('spin-btn');
  btn.disabled = true;
  document.getElementById('result-card').style.display = 'none';

  const winIndex = Math.floor(Math.random()*n);
  const sliceDeg = 360/n;
  const targetCenter = (winIndex + 0.5) * sliceDeg;
  const spins = 5;
  const finalRotation = spins*360 + (360 - targetCenter);

  svg.style.transform = `rotate(${finalRotation}deg)`;

  let tickCount = 0;
  const tickTimer = setInterval(()=>{
    playTick();
    tickCount++;
    if(tickCount > 34) clearInterval(tickTimer);
  }, 120);

  setTimeout(()=>{
    clearInterval(tickTimer);
    const spot = spots[winIndex];
    landedSpotName = spot.n;
    document.getElementById('result-region').textContent = REGIONS[currentRegionKey].name + ' · ' + spot.c;
    document.getElementById('result-name').textContent = spot.n;
    document.getElementById('result-blurb').textContent = spot.b;
    document.getElementById('result-links').innerHTML = mapLinks(REGIONS[currentRegionKey].name, spot.c, spot.n);
    document.getElementById('result-card').style.display = 'block';
    playFanfare();
    fireConfetti();

    const key = visitedKey(currentRegionKey, spot.n);
    const isVisited = !!visited[key];
    const vBtn = document.getElementById('visited-toggle');
    vBtn.textContent = isVisited ? '다녀온 곳으로 표시됨' : '다녀왔어요로 표시';
    vBtn.className = 'visited-btn' + (isVisited ? ' done' : '');
    vBtn.onclick = ()=>{
      visited[key] = !visited[key];
      saveVisited();
      const nowVisited = !!visited[key];
      vBtn.textContent = nowVisited ? '다녀온 곳으로 표시됨' : '다녀왔어요로 표시';
      vBtn.className = 'visited-btn' + (nowVisited ? ' done' : '');
      renderChipGroups(landedSpotName);
      updateStats();
    };

    renderChipGroups(landedSpotName);
    updateStats();
    btn.disabled = false;
  }, 4300);
});

loadVisited();
populateRegionSelect();
populateCitySelect();
drawWheel();
renderChipGroups(null);
updateStats();
</script>
